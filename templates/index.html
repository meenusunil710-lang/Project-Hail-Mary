<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project Hail Mary — Mission Control Interface for Eridian Communications">
    <title>PROJECT HAIL MARY · MISSION CONTROL</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- ── Sidebar · Mission Control Panel ── -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <h2>PROJECT HAIL MARY</h2>

            <button class="new-chat-btn" onclick="newChat()">
                ◆ NEW UPLINK
            </button>
        </div>

        <div id="conversation-list" class="conversation-list">
            <!-- Populated by JS -->
        </div>

        <div class="sidebar-footer">
            <span class="footer-status" id="system-clock"></span>
            <span class="footer-label">ALL SYSTEMS NOMINAL</span>
        </div>

    </aside>

    <!-- ── Chat Area · Flight Deck ── -->
    <main class="chat-area">

        <header class="chat-header">

           
            <div>
                <h1>ROCKY</h1>
                <p>ERIDIAN ENGINEER · UPLINK ACTIVE</p>
            </div>

            <div class="header-telemetry">
                <span class="telemetry-dot"></span>
                <span class="telemetry-label">CONNECTED</span>
            </div>

        </header>

        <div class="chat" id="chat">

            <div class="system-status">
                ◆ SECURE CHANNEL ESTABLISHED
                <br>
                <span class="status-sub">ERIDIAN-HUMAN TRANSLATION LAYER ONLINE</span>
            </div>

            <div class="message rocky">
                <div class="msg-meta">◁ ROCKY · FIRST CONTACT</div>
                <div class="msg-body">Hello, friend.</div>
            </div>

        </div>

        <div class="input-area">

            <input
                id="message"
                type="text"
                placeholder="ENTER TRANSMISSION..."
                autocomplete="off"
                spellcheck="false">

            <button onclick="sendMessage()">
                TRANSMIT
            </button>

        </div>

    </main>

</div>

<script src="{{ url_for('static', filename='chat.js') }}"></script>

<script>
    // ── Live Mission Clock ──
    function updateClock() {
        const el = document.getElementById("system-clock");
        if (!el) return;
        const now = new Date();
        const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        el.textContent = `MET ${String(doy).padStart(3,'0')}:${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
